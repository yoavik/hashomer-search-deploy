version: "3.8"

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../index.html:/srv/index.html:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - embed
      - search
      - index
    restart: unless-stopped

  embed:
    build:
      context: .
      dockerfile: embed/Dockerfile
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - model-cache:/root/.cache
    restart: unless-stopped

  search:
    build:
      context: .
      dockerfile: search/Dockerfile
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - EMBED_SERVICE_URL=http://embed:8000
      - PYTHONUNBUFFERED=1
    depends_on:
      - embed
    restart: unless-stopped

  index:
    build:
      context: .
      dockerfile: index/Dockerfile
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - EMBED_SERVICE_URL=http://embed:8000
      - PYTHONUNBUFFERED=1
    depends_on:
      - embed
    restart: unless-stopped

volumes:
  model-cache:
  caddy-data:
  caddy-config:
